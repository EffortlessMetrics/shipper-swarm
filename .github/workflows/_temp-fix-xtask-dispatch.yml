name: Temporary xtask dispatch repair

on:
  push:
    branches:
      - release/0.5-preparation-contract-v2

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.repository == 'EffortlessMetrics/shipper-swarm' &&
      github.ref == 'refs/heads/release/0.5-preparation-contract-v2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact branch head
        uses: actions/checkout@v7.0.1
        with:
          ref: release/0.5-preparation-contract-v2
          fetch-depth: 0

      - name: Pin every control-plane dispatch and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo_config = Path('.cargo/config.toml')
          text = cargo_config.read_text(encoding='utf-8')
          old = 'precommit = "run --locked --package xtask -- precommit"'
          new = 'precommit = "run --locked --package xtask --bin xtask -- precommit"'
          if old not in text:
              raise SystemExit('precommit alias pattern not found')
          cargo_config.write_text(text.replace(old, new, 1), encoding='utf-8')

          precommit = Path('xtask/src/precommit.rs')
          text = precommit.read_text(encoding='utf-8')
          old = '--package xtask -- precommit run'
          new = '--package xtask --bin xtask -- precommit run'
          if old not in text:
              raise SystemExit('installed hook dispatch pattern not found')
          text = text.replace(old, new, 1)

          assertion_anchor = 'assert!(script.contains("--manifest-path \\"$snapshot/xtask/Cargo.toml\\""));'
          assertion = '        assert!(script.contains("--package xtask --bin xtask -- precommit run"));\n'
          if assertion.strip() not in text:
              if assertion_anchor not in text:
                  raise SystemExit('hook dispatch assertion anchor not found')
              text = text.replace(assertion_anchor, assertion_anchor + '\n' + assertion.rstrip('\n'), 1)
          precommit.write_text(text, encoding='utf-8')
          PY

          cargo fmt --all
          git rm .github/workflows/_temp-fix-xtask-dispatch.yml
          git diff --check

          git config user.name "EffortlessSteven"
          git config user.email "git@effortlesssteven.com"
          git add .cargo/config.toml xtask/src/precommit.rs
          git commit -m "fix(release): pin precommit to the xtask binary"
          git push origin HEAD:release/0.5-preparation-contract-v2
