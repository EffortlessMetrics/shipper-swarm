name: Branch development snapshot

on:
  push:
    branches:
      - codex/fix-per-error-retry
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@v7.0.1

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Fetch locked dependency graph
        run: cargo fetch --locked

      - name: Pack source, Rust toolchain, and Cargo cache
        shell: bash
        run: |
          tar --exclude=.git -czf "$RUNNER_TEMP/shipper-source-${GITHUB_SHA}.tar.gz" .
          tar -C "$HOME/.rustup/toolchains" -czf "$RUNNER_TEMP/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz" 1.95.0-x86_64-unknown-linux-gnu
          tar -C "$HOME/.cargo" -czf "$RUNNER_TEMP/cargo-cache-${GITHUB_SHA}.tar.gz" registry

      - name: Upload exact-head source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: shipper-source-${{ github.sha }}
          path: ${{ runner.temp }}/shipper-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload Rust 1.95 toolchain
        uses: actions/upload-artifact@v4
        with:
          name: rust-1.95.0-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/rust-1.95.0-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload locked Cargo cache
        uses: actions/upload-artifact@v4
        with:
          name: shipper-cargo-cache-${{ github.sha }}
          path: ${{ runner.temp }}/cargo-cache-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
