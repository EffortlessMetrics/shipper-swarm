name: Live runner interruption rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/live-runner-interruption-rehearsal.yml"
      - "scripts/ci/check-live-interruption-routing.py"
      - "scripts/ci/check-full-ci-hosted.py"
      - "crates/shipper-cli/tests/e2e_rehearse.rs"
      - "crates/shipper-core/src/engine/**"
      - "crates/shipper-core/src/state/**"

permissions:
  contents: read

jobs:
  interrupt:
    name: Interrupt and upload .shipper
    if: &self_hosted >-
      github.repository != 'EffortlessMetrics/shipper-swarm' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    steps: &interrupt_steps
      - uses: actions/checkout@v7.0.1

      - name: Check artifact rehearsal routing
        run: python3 scripts/ci/check-live-interruption-routing.py --test

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'hosted-' || '' }}${{ runner.os }}-cargo-live-interruption-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'hosted-' || '' }}${{ runner.os }}-cargo-live-interruption-

      - name: Create interrupted .shipper artifact
        env:
          SHIPPER_LIVE_REHEARSAL_ROOT: ${{ runner.temp }}/shipper-live-interruption
          SHIPPER_LIVE_REHEARSAL_REGISTRY_ADDR: 127.0.0.1:39197
        run: |
          cargo test -p shipper-cli --test e2e_rehearse live_runner_interruption_seed_uploads_shipper_artifact -- --ignored --exact --nocapture

      - name: Upload interrupted .shipper
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shipper-live-interruption-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/shipper-live-interruption/.shipper/
          include-hidden-files: true
          retention-days: 30

  resume:
    name: Download .shipper and resume
    if: *self_hosted
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx43, rust-medium, trusted-pr]
    needs: interrupt
    steps: &resume_steps
      - uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.environment == 'github-hosted' && 'hosted-' || '' }}${{ runner.os }}-cargo-live-interruption-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.environment == 'github-hosted' && 'hosted-' || '' }}${{ runner.os }}-cargo-live-interruption-

      - name: Prepare rehearsal root
        run: |
          mkdir -p "${{ runner.temp }}/shipper-live-interruption/.shipper"

      - name: Download interrupted .shipper
        uses: actions/download-artifact@v8
        with:
          name: shipper-live-interruption-seed-${{ github.run_id }}
          path: ${{ runner.temp }}/shipper-live-interruption/.shipper/

      - name: Resume from downloaded .shipper
        env:
          SHIPPER_LIVE_REHEARSAL_ROOT: ${{ runner.temp }}/shipper-live-interruption
          SHIPPER_LIVE_REHEARSAL_REGISTRY_ADDR: 127.0.0.1:39197
        run: |
          cargo test -p shipper-cli --test e2e_rehearse live_runner_interruption_resume_downloaded_artifact_preserves_invariants -- --ignored --exact --nocapture

      - name: Upload resumed .shipper
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: shipper-live-interruption-resume-${{ github.run_id }}
          path: ${{ runner.temp }}/shipper-live-interruption/.shipper/
          include-hidden-files: true
          retention-days: 30

  # Swarm's path-triggered merge proof must not wait for unavailable cx43
  # allocation. Keep the release-authority repository's existing route intact.
  interrupt-hosted:
    name: Interrupt and upload .shipper (GitHub-hosted)
    if: &swarm_hosted >-
      github.repository == 'EffortlessMetrics/shipper-swarm' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps: *interrupt_steps

  resume-hosted:
    name: Download .shipper and resume (GitHub-hosted)
    if: *swarm_hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: interrupt-hosted
    steps: *resume_steps
