# Scheduled fuzzing plus compile-only coverage for every declared target.
# Extended fuzz runs remain nightly/on-demand, not part of ordinary PRs.
# Based on cargo-fuzz: https://github.com/rust-fuzz/cargo-fuzz

name: Fuzz

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'crates/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration per target in seconds'
        required: false
        default: '300'
      targets:
        description: 'Comma-separated manifest target names, or "all" for the six-target nightly set'
        required: false
        default: 'all'

env:
  CARGO_TERM_COLOR: always

# Least privilege - only read access needed
permissions:
  contents: read

jobs:
  check-targets:
    name: Compile all fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      duration: ${{ steps.select.outputs.duration }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
      - name: Cache Cargo + fuzz checks
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: fuzz-check-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            fuzz-check-${{ runner.os }}-
      - name: Validate campaign inputs and select targets
        id: select
        env:
          REQUESTED_TARGETS: ${{ inputs.targets || 'all' }}
          REQUESTED_DURATION: ${{ inputs.duration || '300' }}
        run: |
          case "$REQUESTED_DURATION" in
            ''|*[!0-9]*) echo '::error::Duration must be a positive integer.'; exit 1 ;;
          esac
          if ! [ "$REQUESTED_DURATION" -gt 0 ]; then
            echo '::error::Duration must be a positive integer.'
            exit 1
          fi
          metadata=$(cargo metadata --manifest-path fuzz/Cargo.toml --no-deps --format-version 1)
          matrix=$(jq -ce --arg requested "$REQUESTED_TARGETS" \
            --argjson defaults '["load_state","resolve_token","encrypt_decrypt","retry_strategy","types_serialization","redact_output"]' '
            .packages[] | select(.name == "shipper-fuzz") |
            [.targets[] | select(.kind | index("bin")) | .name] as $available |
            ($requested | gsub("^\\s+|\\s+$"; "")) as $request |
            (if $request == "all" then $defaults else
              $request | split(",") | map(gsub("^\\s+|\\s+$"; "")) end) as $selected |
            if ($selected | length) == 0 or any($selected[]; . == "") then
              error("Select at least one nonempty target name")
            elif any($selected[]; . as $name | $available | index($name) | not) then
              error("Unknown fuzz target; use a binary declared in fuzz/Cargo.toml")
            else {target: ($selected | unique)} end
          ' <<< "$metadata")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "duration=$REQUESTED_DURATION" >> "$GITHUB_OUTPUT"
      - name: Check every declared fuzz binary
        # fuzz/ is excluded from the product workspace and has no tracked lockfile.
        # The default workspace checks and the curated nightly matrix miss targets.
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  fuzz:
    name: Fuzz (${{ matrix.target }})
    needs: [check-targets]
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    # PRs and main pushes compile all targets without running extended campaigns.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check-targets.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo + fuzz
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ubuntu-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ubuntu-fuzz-${{ matrix.target }}-
            ubuntu-fuzz-

      - name: Run fuzz target
        id: run_fuzz
        env:
          FUZZ_TARGET: ${{ matrix.target }}
          FUZZ_DURATION: ${{ needs.check-targets.outputs.duration }}
        run: |
          mkdir -p "fuzz/corpus/$FUZZ_TARGET" artifacts
          cargo fuzz run "$FUZZ_TARGET" "fuzz/corpus/$FUZZ_TARGET" \
            -- \
            "-max_total_time=$FUZZ_DURATION" \
            "-artifact_prefix=artifacts/${FUZZ_TARGET}_"
        continue-on-error: true

      - name: Check for crashers
        id: check_crashers
        run: |
          if [ -d "artifacts" ] && [ "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "crashers_found=true" >> $GITHUB_OUTPUT
            echo "::error::Fuzz target ${{ matrix.target }} found crashers"
            ls -la artifacts/
          else
            echo "crashers_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload crashers
        if: steps.check_crashers.outputs.crashers_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: artifacts/
          retention-days: 30

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7

      - name: Fail if crashers found
        if: steps.check_crashers.outputs.crashers_found == 'true'
        run: exit 1

      - name: Fail if the fuzz command failed
        if: steps.run_fuzz.outcome == 'failure'
        run: |
          echo '::error::cargo fuzz failed; absence of a crash artifact is not a passing run.'
          exit 1

  fuzz-summary:
    name: Fuzz Summary
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, cx23, ci-nano, trusted-pr]
    needs: [check-targets, fuzz]
    if: always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule')
    steps:
      - name: Check results
        env:
          COMPILE_RESULT: ${{ needs.check-targets.result }}
          FUZZ_RESULT: ${{ needs.fuzz.result }}
        run: |
          {
            echo '## Fuzz Results'
            echo ''
            echo '| Evidence | Status |'
            echo '|----------|--------|'
            echo "| All target builds | $COMPILE_RESULT |"
            echo "| Fuzz campaign | $FUZZ_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$COMPILE_RESULT" != success ] || [ "$FUZZ_RESULT" != success ]; then
            echo '::error::Fuzz evidence is incomplete or failed; inspect the target jobs.'
            exit 1
          fi
