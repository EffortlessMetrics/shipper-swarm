# Scheduled fuzzing workflow for shipper
# Runs extended fuzz tests nightly and on demand
# Based on cargo-fuzz: https://github.com/rust-fuzz/cargo-fuzz

name: Fuzz

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Duration per target in seconds'
        required: false
        default: '300'
      targets:
        description: 'Specific targets to run (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  CARGO_TERM_COLOR: always

# Least privilege - only read access needed
permissions:
  contents: read

jobs:
  # `cargo fuzz run <target>` builds only the target it runs, so a target left
  # out of the matrix below is never compiled by CI at all. That is how
  # `execution_core` silently stopped building against `ExecutionState` while
  # this workflow stayed green. This job compiles every declared target so the
  # next one to drift fails here instead of rotting unnoticed.
  build-targets:
    name: Build all fuzz targets
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7.0.1

      - name: check runner routing policy
        run: scripts/ci/no-bare-self-hosted.sh

      # Compiling the targets needs no nightly toolchain; only `cargo fuzz run`
      # does. Keeping this on the pinned stable toolchain makes the check cheap
      # and keeps it honest about what contributors build locally.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ubuntu-fuzz-build-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: ubuntu-fuzz-build-

      # No `--locked`: `fuzz/Cargo.lock` is gitignored (.gitignore), so a fresh
      # checkout has none and `--locked` refuses to create one. The fuzz crate is
      # excluded from the workspace and deliberately unpinned; this job is a
      # compile check, not a supply-chain gate.
      - name: Compile every declared fuzz target
        run: cargo check --manifest-path fuzz/Cargo.toml --all-targets

  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on:
      group: em-ci-small
      labels: [self-hosted, linux, x64, em-ci, cx53, rust-large, trusted-pr]
    # Only run on main branch for scheduled runs
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        target:
          - load_state
          - resolve_token
          - encrypt_decrypt
          - retry_strategy
          - types_serialization
          - redact_output

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Cache Cargo + fuzz
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            fuzz/target
          key: ubuntu-fuzz-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
          restore-keys: |
            ubuntu-fuzz-${{ matrix.target }}-
            ubuntu-fuzz-

      - name: Get duration
        id: duration
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.duration }}" >> $GITHUB_OUTPUT
          else
            echo "value=300" >> $GITHUB_OUTPUT
          fi

      - name: Run fuzz target
        run: |
          cargo fuzz run ${{ matrix.target }} \
            --corpus fuzz/corpus/${{ matrix.target }} \
            -- \
            -max_total_time=${{ steps.duration.outputs.value }} \
            -artifact_prefix=artifacts/${{ matrix.target }}_
        continue-on-error: true

      - name: Check for crashers
        id: check_crashers
        run: |
          if [ -d "artifacts" ] && [ "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "crashers_found=true" >> $GITHUB_OUTPUT
            echo "::error::Fuzz target ${{ matrix.target }} found crashers"
            ls -la artifacts/
          else
            echo "crashers_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload crashers
        if: steps.check_crashers.outputs.crashers_found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: artifacts/
          retention-days: 30

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7

      - name: Fail if crashers found
        if: steps.check_crashers.outputs.crashers_found == 'true'
        run: exit 1

  fuzz-summary:
    name: Fuzz Summary
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, cx23, ci-nano, trusted-pr]
    needs: [fuzz]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Fuzz Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          
          # This would need the actual job results to be populated
          echo "| All targets | See individual jobs |" >> $GITHUB_STEP_SUMMARY
