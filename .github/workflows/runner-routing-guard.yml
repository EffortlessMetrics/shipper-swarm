name: Runner Routing Guard

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
      - ".github/jactionlint.*"
      - ".github/dependabot.*"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/ci/no-bare-self-hosted.sh"
      - "scripts/ci/normalize-routed-rust-result.py"
      - "xtask/tests/runner_guard_routing.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
      - ".github/jactionlint.*"
      - ".github/dependabot.*"
      - "**/action.yml"
      - "**/action.yaml"
      - "scripts/ci/no-bare-self-hosted.sh"
      - "scripts/ci/normalize-routed-rust-result.py"
      - "xtask/tests/runner_guard_routing.rs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-bare-self-hosted:
    name: No bare self-hosted routing
    if: github.repository != 'EffortlessMetrics/shipper-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      group: em-ci-nano
      labels: [self-hosted, linux, x64, em-ci, cx23, ci-nano, trusted-pr]
    timeout-minutes: 5
    steps: &routing_guard_steps
      - uses: actions/checkout@v7.0.1
      - name: Install jactionlint
        env:
          JACTIONLINT_VERSION: 2.5.0
          JACTIONLINT_SHA256: 5ac307b0499bb0eab45ae99c23e8e0790874fbc667c75224410954e0e3c6e0f5
        run: |
          set -euo pipefail
          archive="jactionlint_${JACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/jactionlint"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            "https://github.com/jdx/jactionlint/releases/download/v${JACTIONLINT_VERSION}/${archive}" \
            --output "$install_dir/$archive"
          echo "$JACTIONLINT_SHA256  $install_dir/$archive" | sha256sum --check --status
          tar --extract --gzip --file "$install_dir/$archive" --directory "$install_dir"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate workflow syntax
        run: jactionlint --profile correctness --no-online --shellcheck=""
      - name: Check runner routing policy
        run: scripts/ci/no-bare-self-hosted.sh
      - name: Test routed result normalization
        run: python3 scripts/ci/normalize-routed-rust-result.py --test

  # This cheap, read-only guard must not depend on the self-hosted pool it
  # validates. Keep non-swarm routing intact and share the exact proof steps.
  no-bare-self-hosted-hosted:
    name: No bare self-hosted routing (GitHub-hosted)
    if: github.repository == 'EffortlessMetrics/shipper-swarm' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps: *routing_guard_steps
