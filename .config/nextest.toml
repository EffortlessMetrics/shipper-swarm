# Nextest configuration for shipper
# See: https://nexte.st/book/configuration.html

[profile.ci]
# Continue running remaining tests after a failure in CI
fail-fast = false

# Retry failed tests up to two times with exponential backoff
retries = { count = 2, backoff = "exponential", delay = "1s" }

# JUnit output for CI reporting. The path is relative to the profile's
# nextest output directory, which is `target/nextest/ci` for this profile.
junit = { path = "junit.xml" }

# Run up to the detected CPU count of tests concurrently; this is not a timeout
test-threads = "num-cpus"

# Status level for output
status-level = "pass"

# Final status level at end of run
final-status-level = "flaky"

[profile.stress]
# Retry failed tests up to ten times; successful tests are not repeated
retries = { count = 10, backoff = "fixed", delay = "100ms" }
test-threads = 1

[profile.nightly]
# Optional profile for extended testing; the name does not schedule a run
retries = { count = 3, backoff = "exponential", delay = "2s" }
test-threads = "num-cpus"
