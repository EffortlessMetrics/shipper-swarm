# Process policy allowlist.
#
# Named profiles enumerate which shell commands and subprocesses are permitted
# under that policy. Workflows in policy/workflow-allowlist.toml reference one
# of these profiles via `process_policy = "..."`.
#
# These lists are intentionally honest first-pass receipts: they cover what is
# actually invoked today. PR 8 (#207) adds the checker that scans workflows
# for command usage and reconciles against these profiles.

schema_version = "1.0"
policy = "process-allowlist"
owner = "EffortlessMetrics"
status = "active"

# ─── ci ─────────────────────────────────────────────────────────────────────
#
# Default CI profile: build, lint, test the Rust workspace. Also covers
# coverage, architecture-guard, fuzz (nightly variant of cargo), and mutation
# (cargo-mutants installs via taiki-e/install-action).

[[profile]]
name = "ci"
allowed_processes = [
  "cargo",
  "rustup",
  "rustc",
  "shipper",
  "cargo-fuzz",
  "cargo-mutants",
  "cargo-llvm-cov",
  "cargo-nextest",
  "mkdir",
  "python3",
  "curl",
  "sha256sum",
  "ci-disk-guard",
  "df",
  "sccache",
  "rm",
  "tar",
]
owner = "release/ci"
reason = "CI compiles, lints, tests, fuzzes, and measures coverage, and smoke-tests the supported `cargo install --path crates/shipper --locked` facade path. Tools (cargo-fuzz, cargo-mutants, cargo-llvm-cov, cargo-nextest) are installed via taiki-e/install-action. `shipper` is the locally installed facade binary used only by the install-smoke job. `curl`, `sha256sum`, `tar`, `mkdir`, `rm`, `df`, `ci-disk-guard`, and `sccache` support self-hosted runner scratch/cache cleanup and diagnostics; `python3` is used for small helper scripts."
created = "2026-05-11"
review_after = "2026-11-12"

# ─── release ────────────────────────────────────────────────────────────────
#
# Release workflow: builds shipper, runs it as a CLI, attempts Trusted
# Publishing, records auth evidence, uses the configured fallback secret until
# Trusted Publishing default proof exists, produces signed/checksummed binary
# artifacts, and creates the GitHub release.

[[profile]]
name = "release"
allowed_processes = [
  "cargo",
  "rustup",
  "rustc",
  "shipper",
  "gh",
  "git",
  "curl",
  "jq",
  "shasum",
  "tar",
  "sha256sum",
  "mkdir",
]
owner = "release/ci"
reason = "Release workflow validates approved tag/source/tree identity with git and gh, dogfoods shipper itself, installs the supported facade path with `cargo install --path crates/shipper --locked`, verifies exact public versions through the crates.io API or sparse index with curl and jq, packages and independently verifies release binaries with tar, sha256sum or shasum, and jq, creates the GitHub release with gh, attempts Trusted Publishing via OIDC, records auth evidence, and uses the configured fallback secret only when that posture is approved."
created = "2026-05-11"
review_after = "2026-11-12"
