# Cargo alias config for the shipper workspace.

[alias]
# `cargo xtask <cmd>` -> `cargo run --package xtask --bin xtask -- <cmd>`
# See xtask/src/main.rs and docs/policy/NON_RUST_ROLLOUT.md.
# Pin the binary explicitly because the xtask package also contains the
# maintainer-local `changie-roundtrip` binary.
xtask = "run --package xtask --bin xtask --"

# `cargo precommit [run|install|status|uninstall]` delegates to the same xtask
# implementation used by the repository-owned Git hook. Keep the local gate on
# the reviewed lockfile rather than resolving dependency changes during commit.
precommit = "run --locked --package xtask --bin xtask -- precommit"

# `cargo changelog-roundtrip` is the maintainer-local proof that Changie's
# retained version files reproduce the tracked changelog without rewriting or
# truncating pre-Changie history. Changie itself intentionally remains out of CI.
changelog-roundtrip = "run --locked --package xtask --bin changie-roundtrip --"
